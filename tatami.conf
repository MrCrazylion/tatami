#
# /etc/tatami.conf: tatami(8) configuration
#

# File extension of packages (without the leading dot). Both tatami and
# tatamk use it, so every package of one system shares one format.
#PKG_EXT=pkg.tar.zst

# Directories holding package files; 'tatami update' indexes them.
# Separate several directories with spaces or colons.
#REPO_DIRS=/var/lib/tatami/packages

# Architecture used for solving (default: the machine architecture).
#ARCH=x86_64

# tatamk only: build packages inside a bubblewrap sandbox (read-only system,
# no network, only /tmp and the package root writable). "no" builds
# directly on the host; tatamk --no-bulkhead does the same for one build.
#BULKHEAD=yes

# tatamk only: compression of built packages (gz, xz, zst, bz2 or none).
# Default: taken from the end of PKG_EXT, or gz if that does not tell.
#PKG_COMPRESSION=zst

# Rules for files that already exist when a package is installed or upgraded,
# exactly as in pkgutils' pkgadd.conf: EVENT PATTERN ACTION. The last matching
# rule wins. Files an UPGRADE rule says NO to keep their old version, the new
# one is placed in var/lib/tatami/rejected. An INSTALL rule saying NO skips
# the file entirely.
#UPGRADE	^.*$			YES

UPGRADE		^etc/.*$		NO
UPGRADE		^var/log/.*$		NO
UPGRADE		^var/spool/\w*cron/.*$	NO

# End of file
