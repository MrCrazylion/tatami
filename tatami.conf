#
# /etc/tatami/tatami.conf: tatami(8) and tatamk(8) configuration
#
# Settings are KEY = value (blanks around '=' are fine). Everything is looked up
# in the installation root (tatami -r <root>), so a root has its own configuration.

# Where the packages are: directories (or file:// URLs), separated by blanks. The
# first one listed wins when a version is in several. A directory holding a
# repo.solv (written by 'tatami index <dir>' or 'tatami update') is read through
# that binary index; otherwise its packages are scanned. http://, https:// and
# ftp:// URLs are remote repositories (see FETCHCMD). Repositories listed in
# <root>/etc/tatami/repos.conf or repos.d/*.conf (name=url lines) are used
# instead of this. Default, when nothing is configured anywhere, is the local
# directory <root>/var/lib/tatami/packages: tatami stays offline.
#REPO_DIRS=/srv/packages /var/lib/tatami/packages

# Trusted public keys are the files in /etc/tatami/keys/ (the .pub files made by
# 'tatami keygen', hex or base64): to trust a signer, drop its .pub file there; to
# stop trusting it, delete the file. For every remote repo.solv and package tatami
# also fetches <file>.sig and verifies it; a signature by ANY of the keys is good,
# anything else aborts. Local paths and file:// repositories and package files given
# on the command line are trusted and never checked. With no key in the directory a
# remote repository is refused, unless you accept unsigned remote data here:
#ALLOW_UNSIGNED = no

# The command that downloads a remote repository's repo.solv ('tatami update')
# and its packages ('tatami install'). tatami has no network code of its own. It is
# started directly, not through a shell; %URL% and %DEST% are replaced. It is
# never used for a local path or file:// repository. Its stderr is read for
# "NN.N%" figures (curl -#) to draw tatami's progress bar. Default:
#FETCHCMD=curl -f -L -# "%URL%" -o "%DEST%"

# tatamk only: build packages inside a bubblewrap sandbox (read-only system,
# no network, only /tmp and the package root writable). "no" builds
# directly on the host; tatamk --no-bulkhead does the same for one build.
#BULKHEAD=yes

# Held packages are listed in /etc/tatami/hold, the rules for files that already
# exist in /etc/tatami/upgrade.rules, the repositories in /etc/tatami/repos.conf.
# The architecture is the machine's (uname); it is not configurable. Neither are the
# package extension and compression: they are fixed when tatami is built (build.conf).

# What to run after a transaction (ldconfig, cache updates, ...) is not part of
# tatami: it is described by hook files in /etc/tatami/hooks.d, see the README.

# End of file
