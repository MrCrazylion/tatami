#
# /etc/tatami.conf: tatami(8) and tatamk(8) configuration
#
# Settings are KEY = value (blanks around '=' are fine). Everything is looked up
# in the installation root (tatami -r <root>), so a root has its own configuration.

# Packages are named <name>_<version>_<arch>.<extension>. By default the extension
# is tar.<compression> (tar.zst, tar.xz, ...) and every one of them is accepted.
# Set PKG_EXT to use one fixed extension for both tools instead (no leading dot).
#PKG_EXT=

# Where the packages are: directories (or file:// URLs), separated by blanks. The
# first one listed wins when a version is in several. A directory holding a
# repo.solv (written by 'tatami index <dir>' or 'tatami update') is read through
# that binary index; otherwise its packages are scanned. Network URLs are not
# supported. Default: <root>/var/lib/tatami/packages
#REPO_DIRS=/srv/packages /var/lib/tatami/packages

# Architecture of the target system (default: the machine's, uname -m). Packages of
# any other architecture are refused, noarch ones fit everywhere. A list allows
# more: ARCH=x86_64:i686 is a multilib system. tatamk builds for the first entry.
#ARCH=x86_64

# tatamk only: compression of built packages: gz, zst (default), xz, bz2, lz4,
# lzma or none. Done by tatami itself, no external program is used.
#PKG_COMPRESSION=zst

# tatamk only: build packages inside a bubblewrap sandbox (read-only system,
# no network, only /tmp and the package root writable). "no" builds
# directly on the host; tatamk --no-bulkhead does the same for one build.
#BULKHEAD=yes

# Rules for files that already exist when a package is installed or upgraded,
# exactly as in pkgutils' pkgadd.conf: EVENT PATTERN ACTION. The last matching
# rule wins. Files an UPGRADE rule says NO to keep their old version, the new
# one is placed in var/lib/tatami/rejected. An INSTALL rule saying NO skips
# the file entirely.
#UPGRADE	^.*$			YES

UPGRADE		^etc/.*$		NO
UPGRADE		^var/log/.*$		NO
UPGRADE		^var/spool/\w*cron/.*$	NO

# What to run after a transaction (ldconfig, cache updates, ...) is not part of
# tatami: it is described by hook files in /etc/tatami/hooks.d, see the README.

# End of file
