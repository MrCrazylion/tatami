# tatami build configuration
#
# Edit the values below before running 'make'. One KEY=VALUE per line, nothing else:
# no spaces around '=', and comments only on lines of their own. A key you remove
# gets its default. The make command line still wins: make PREFIX=/opt

# Where 'make install' puts the programs (bin/) and the manual pages (share/man/)
PREFIX=/usr

# Where tatami looks for its files, compiled into the binary. Absolute paths; at run time
# they are below the installation root given with --root (default /).
#   SYSCONFDIR: tatami/tatami.conf, repos.conf, repos.d/, hooks.d/
#   DB_DIR:     package database, journal, indexes of remote repositories and the
#               default local repository DB_DIR/packages
#   CACHEDIR:   packages/ with the downloaded packages
SYSCONFDIR=/etc
DB_DIR=/var/lib/tatami
CACHEDIR=/var/cache/tatami

# Extension of package files, without the leading dot. The compression inside is detected
# from the content. Leave empty for tar.<compression> (tar.zst, tar.xz, ...).
PKG_EXT=tar.pkg
